<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… — Star Wars Watchlist Maker</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --show-color: #8B7355; }
  .header h1 { color: var(--show-color); }
  .nav-tab.active { border-color: var(--show-color); color: var(--show-color); background: color-mix(in srgb, var(--show-color) 10%, transparent); }
  .progress-fill { background: var(--show-color) !important; }
</style>
</head>
<body>
<div class="stars-bg"></div>
<div class="app-wrapper">

  <div class="header">
    <h1 id="showTitle">⬡ LOADING ⬡</h1>
    <p id="showYears" style="color:var(--sw-muted);font-size:15px;letter-spacing:2px;margin-top:4px;"></p>
  </div>

  <div class="nav-tabs" id="navTabs"></div>
  <div id="filtersArea"></div>
  <div id="wtArea"></div>
  <div class="items-list" id="epList"></div>

  <!-- Item Edit Modal -->
  <div class="modal-overlay" id="itemModal">
    <div class="modal">
      <button class="modal-close" onclick="app.attemptCloseModal('itemModal')">✕</button>
      <div class="modal-title" id="itemModalTitle">Edit Episode</div>
      <div id="itemModalBody" oninput="app.markDirty()" onchange="app.markDirty()"></div>
    </div>
  </div>

  <!-- Watchthrough Modal -->
  <div class="modal-overlay" id="wtModal">
    <div class="modal">
      <button class="modal-close" onclick="app.closeModal('wtModal')">✕</button>
      <div class="modal-title">Watchthrough</div>
      <div id="wtModalBody"></div>
    </div>
  </div>

  <div class="save-indicator" id="saveIndicator">SAVED</div>

</div>
<script src="data.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/models.js"></script>
<script src="js/components.js"></script>
<script src="js/base-app.js"></script>
<script src="js/show-app.js"></script>
<script>
  window.app = new ShowPageApp();
  app.init();
</script>
</body>
</html>
